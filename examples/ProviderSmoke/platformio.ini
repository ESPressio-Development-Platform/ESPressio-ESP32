[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/ESPressio-Development-Platform/ESPressio-System.git#structural_realignment_propagation_ESPressio-Mesh
    https://github.com/ESPressio-Development-Platform/ESPressio-Radio.git#structural_realignment_propagation_ESPressio-Mesh
    https://github.com/ESPressio-Development-Platform/ESPressio-WiFi.git#structural_realignment
    https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#structural_realignment
lib_extra_dirs =
    ../..

[env:esp32dev-sync-diagnostics]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DESPRESSIO_ESP32_SYNCHRONIZATION_DIAGNOSTICS=1
