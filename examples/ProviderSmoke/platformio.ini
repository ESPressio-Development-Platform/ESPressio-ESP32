[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17
lib_deps =
    https://github.com/ESPressio-Development-Platform/ESPressio-System.git#feature/1-system-memory-policy
    https://github.com/ESPressio-Development-Platform/ESPressio-WiFi.git#feature/20-wifi-off-mode
    https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#feature/10-platform-storage-abstractions
lib_extra_dirs =
    ../..
