[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17
    -DESPRESSIO_ESP32_RAW_RADIO_LEAN_WIFI_BOOTSTRAP=1
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/ESPressio-Development-Platform/ESPressio-System.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Threads.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Task.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Event.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Radio.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Mesh.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-WiFi.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#primitives_redesign
lib_extra_dirs =
    ../..

[env:esp32dev-sync-diagnostics]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DESPRESSIO_ESP32_SYNCHRONIZATION_DIAGNOSTICS=1
