[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/ESPressio-Development-Platform/ESPressio-System.git#feature/1-system-memory-policy
    https://github.com/ESPressio-Development-Platform/ESPressio-Radio.git#feature/1-radio-transport
    https://github.com/ESPressio-Development-Platform/ESPressio-WiFi.git#item_4_saturation_testing
    https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#item_4_saturation_testing
lib_extra_dirs =
    ../..

[env:esp32dev-sync-diagnostics]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DESPRESSIO_ESP32_SYNCHRONIZATION_DIAGNOSTICS=1
