name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'optimisation/**'
      - structural_realignment_propagation_ESPressio-Mesh
  pull_request:

jobs:
  esp32-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build provider smoke project
        working-directory: examples/ProviderSmoke
        shell: bash
        run: |
          set -o pipefail
          pio run 2>&1 | tee ../../esp32-provider-build.log
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-provider-build-log
          path: esp32-provider-build.log
          if-no-files-found: warn
